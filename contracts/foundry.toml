[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]



# These URLs are intentionally provided at test time rather than committed.
# Fork tests skip when an endpoint is not configured.
[rpc_endpoints]
bot_mainnet = "${BOT_MAINNET_RPC_URL}"
bot_testnet = "${BOT_TESTNET_RPC_URL}"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
